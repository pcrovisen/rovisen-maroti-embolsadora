name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  # The authoritative build: the same MSBuild + packages.config toolchain used on
  # the plant/dev PC. This is what decides whether a change compiles for real.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2
      - uses: nuget/setup-nuget@v2

      - name: Restore packages
        run: nuget restore ModbusServer.sln

      # secrets.config is gitignored and the csproj includes it conditionally,
      # so nothing is needed here for it to be absent.
      - name: Build
        run: msbuild ModbusServer.sln /p:Configuration=Release /p:Platform="Any CPU" /nologo /verbosity:minimal

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            ModbusServer/bin/Release/
            TcpHMIClient/bin/Release/
          if-no-files-found: error

  # Fast feedback for whoever is working off Windows: the same sources compiled
  # against the .NET Framework reference assemblies. Catches syntax and type
  # errors in seconds, and needs no Windows runner.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: ./build/typecheck.sh

  # The Web HMI derives its enum mirrors and state-machine graphs from the C#
  # sources. Changing a machine without regenerating leaves the pages quietly
  # wrong — a removed enum member shifts every ordinal after it — so fail.
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node WebHMI/devserver/generate.mjs
      - name: generated files are up to date
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::Generated files are stale. Run: node WebHMI/devserver/generate.mjs"
            exit 1
          fi
      # The single-file demos are not covered by anything else, and they inline
      # these same sources.
      - run: node WebHMI/devserver/build_demos.mjs "$RUNNER_TEMP/demos"
