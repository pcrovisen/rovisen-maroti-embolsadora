.demo-badge {
  padding: 0.2rem 0.6rem;
  border: 1px solid var(--warn);
  border-radius: 999px;

/*__BODY__*/

<script>
/*__ENUMS__*/
/*__COMMON__*/

const TRANSITIONS = /*__TRANSITIONS__*/;

/*__DIAG__*/

// ---------------------------------------------------------------------------
// Local line simulation (same code as devserver/dummy_server.mjs)
// ---------------------------------------------------------------------------

// Instance names as the real server produces them (class + identifier);
// the state lists come from the generated enums.
const MACHINE_STATES = Object.fromEntries([
  'FatekPLCCommunication', 'PalletEntry', 'PalletLabel1', 'PalletLabel2',
  'CarMachine', 'DeletePalletEmb1', 'DeletePalletEmb2', 'AcceptHMIs',
  'ElevatorAccess', 'PrinterMachineWolrdjet1', 'PrinterMachineWolrdjet2',
  'OmronConnection192.168.6.124', 'OmronConnection192.168.250.1',
  'NetworkPrinterConnection192.168.6.122', 'NetworkPrinterConnection192.168.6.163',
  'QrReaderConnection192.168.6.236', 'QrReaderConnection192.168.6.241',
].map((n) => [n, statesForMachine(n)]));

/*__SIM__*/

// ---------------------------------------------------------------------------
// Drive the page from the local simulation instead of SSE
// ---------------------------------------------------------------------------

DECLARED = TRANSITIONS;

setInterval(() => {
  const t = now();
  stepEntry(t);
  stepCar(t);
  stepPackager1(t);
  stepPackager2(t);
  stepDisturbances(t);
  const st = buildStatus();
  lastStatus = st;
  for (const [name, idx] of Object.entries(st.MachineState)) {
    const statesDict = st.States && st.States[name];
    if (!statesDict) continue;
    setMachineState(name, ensureMeta(name, statesDict), idx);
  }
  renderConnChips(st);
  refreshStateTexts();
  refreshView(st);
  if (tablesDialog.open) renderTables(st);
}, 500);
</script>
