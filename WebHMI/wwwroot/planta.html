<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planta — Línea Embolsadora</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="stage-page">

  <header class="topbar">
    <div class="brand">
      <h1>Vista de planta</h1>
    </div>
    <nav class="page-nav">
      <a class="nav-link" href="index.html">Panel</a>
      <a class="nav-link" href="planta.html" aria-current="page">Planta</a>
      <a class="nav-link" href="diagnostico.html">Diagnóstico</a>
    </nav>
  </header>

  <div class="statusbar">
    <span class="statusbar-server">
      <span class="brand-dot" id="serverDot"></span>Servidor
    </span>
    <div class="conns" id="connChips"></div>
  </div>

  <main class="plant-page">
    <div class="plant-stage" id="plantStage">
      <svg id="plantFloorSvg"></svg>
      <svg id="plantSvg" tabindex="0"></svg>
      <div class="plant-toolbar">
        <button class="btn" id="zoomInBtn" title="Acercar">+</button>
        <button class="btn" id="zoomOutBtn" title="Alejar">−</button>
        <button class="btn" id="zoomFitBtn" title="Vista completa">⤢</button>
        <button class="btn" id="rotateBtn" title="Rotar 90°">⟳</button>
      </div>
      <div class="plant-hint">Arrastrar / rueda: mover · Pellizco (Ctrl+rueda): zoom</div>
      <div class="plant-notices" id="plantNotices"></div>
    </div>
  </main>

  <div class="offline-overlay hidden" id="offlineOverlay">
    <div>
      <h2>Sin conexión con el servidor</h2>
      <p>Reintentando automáticamente…</p>
    </div>
  </div>

  <script src="common.js"></script>
  <script src="plant.js"></script>
</body>
</html>
